# Публикация сборки: положите файлы из dist (packtool) в папку release/ и отправьте в main.
# Этот workflow создаст релиз v<версия из pack.json> и сделает его последним — лаунчер подхватит его сам.
name: Publish pack release
on:
  push:
    branches: [main]
    paths: ["release/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          V=$(jq -r .version release/pack.json)
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Релиз v$V уже есть — обновляю файлы"
            find release -maxdepth 1 -type f ! -name NOTES.md -print0 | xargs -0 gh release upload "v$V" --clobber
            gh release edit "v$V" --latest
          else
            NOTES=release/NOTES.md; [ -f "$NOTES" ] || { echo "Сборка SEGMENT $V" > /tmp/n.md; NOTES=/tmp/n.md; }
            find release -maxdepth 1 -type f ! -name NOTES.md -print0 | xargs -0 gh release create "v$V" --title "SEGMENT $V" --notes-file "$NOTES" --latest
          fi
